services:
  web:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      # Mapeia o teu código fonte para atualizar em tempo real    
      - ./frontend:/app
      
      # Isola o node_modules para não ser substituído
      - /app/node_modules
      
      # A LIGAÇÃO DAS FOTOS:
      # Lado esquerdo: A pasta no servidor
      # Lado direito: O caminho dentro do Docker onde o React as vai ler
      - ../dados_privados/fotos_gdrive:/app/public/photos
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - backend # O frontend só arranca depois do backend

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      # LIGAÇÃO DAS FOTOS PARA O BACKEND (Para ele conseguir fazer o scan)
      # Liga a pasta dados_privados ao caminho /dados_privados dentro do Docker
      - ../dados_privados:/dados_privados
