# Compose para o Coolify (produção).
# - Sem portas publicadas: o Coolify encaminha o domínio para o serviço "web" (porta 80).
# - Sem caminhos fora do repositório (../dados_privados não existe no servidor do Coolify).
# - Dados e fotos ficam em volumes nomeados, que sobrevivem a novos deploys.
# - Variáveis (ADMIN_USER, ADMIN_PASS) definem-se no separador "Environment Variables" do Coolify.
services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_WEB_80

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/data
      - ADMIN_USER=${ADMIN_USER:?Define ADMIN_USER no Coolify}
      - ADMIN_PASS=${ADMIN_PASS:?Define ADMIN_PASS no Coolify}
    volumes:
      # photos.json, collections.json, categories.json, settings.json
      - pinhality-data:/data
      # fotos_gdrive/ e rclone.conf (o mesmo caminho que o server.js já usa)
      - pinhality-privado:/dados_privados
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/settings"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pinhality-data:
  pinhality-privado:
