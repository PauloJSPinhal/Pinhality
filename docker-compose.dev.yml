# Desenvolvimento local: docker compose -f docker-compose.dev.yml up --build
# - Um só contentor com Vite (http://localhost:5173, hot reload) e nodemon (API na porta 3000).
# - O código é montado do disco: as alterações aparecem logo.
# - Fotos e .env vêm da pasta dados_privados (por omissão ../dados_privados, ao lado do repositório).
#   Para usar outra pasta: DADOS_PRIVADOS=./dados_privados docker compose -f docker-compose.dev.yml up
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "5173:5173"
      - "3000:3000"
    env_file:
      - path: ${DADOS_PRIVADOS:-../dados_privados}/.env
        required: false
    environment:
      - NODE_ENV=development
      - PORT=3000
      - PHOTOS_DIR=/dados_privados/fotos_gdrive
      # Credenciais do rclone e segredo da sessão fora do código montado
      - PRIVATE_DIR=/private
      - API_TARGET=http://localhost:3000
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - /app/backend/node_modules
      - /app/frontend/node_modules
      - ${DADOS_PRIVADOS:-../dados_privados}:/dados_privados
      - pinhality-dev-private:/private

volumes:
  pinhality-dev-private:
