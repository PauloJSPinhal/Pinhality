# Desenvolvimento local, igual à produção mas com hot reload:
# Paulo: o login admin/admin daqui só funciona em desenvolvimento; em produção é recusado.
#   docker compose -f docker-compose.dev.yml up --build
# - Um só contentor com Vite (http://localhost:5173) e nodemon (API na porta 3000).
# - Só o código é montado do disco. Dados e fotos ficam em volumes nomeados que começam vazios;
#   as fotos chegam pela sincronização com o Google Drive (Gerir → Ligação ao Drive).
# - Login por omissão: admin / admin. Para mudar, crie ./.env (já no .gitignore) com
#   ADMIN_USER=... e ADMIN_PASS=... (o Docker Compose lê-o automaticamente).
# - Apagar tudo (dados, fotos e credenciais): docker compose -f docker-compose.dev.yml down -v
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "5173:5173"
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATA_DIR=/data
      - PHOTOS_DIR=/dados_privados/fotos_gdrive
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-admin}
      - SESSION_SECRET=${SESSION_SECRET:-pinhality-dev-session-secret-nao-usar-em-producao}
      - ORIGINAL_CACHE_MB=${ORIGINAL_CACHE_MB:-0}
      - SYNC_CONCURRENCY=${SYNC_CONCURRENCY:-3}
      - API_TARGET=http://localhost:3000
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - /app/backend/node_modules
      - /app/frontend/node_modules
      # JSON da base de dados e private/ (rclone.conf, permissões 600)
      - pinhality-dev-data:/data
      # derivados/<coleção>/thumb|web/*.webp e manifest.json
      - ..dados_privados:/dados_privados

volumes:
  pinhality-dev-data:
  pinhality-dev-fotos:


